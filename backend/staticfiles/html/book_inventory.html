{%load static%}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maktaba — Admin Dashboard</title>
  <link rel="stylesheet" href="{% static 'css/admin_dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  <link rel="stylesheet" href="{% static 'css/book_inventory.css' %}">
</head>

<body>
  <div class="dashbord-wrapper">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <h2>Maktaba Admin</h2>
        <p>FCAI - Library</p>
      </div>

      <ul class="sidbar-nav">
        <li><a href="{% url 'admin_dashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'book_inventory' %}">Book Inventory</a></li>
        <li><a href="{% url 'add_book_page' %}">Add Book</a></li>
      </ul>

      <div class="sidebar-user">
        <p id="username"></p>
        <p id="email"></p>
        <a href="{% url 'log_in' %}" id="logoutButton" class="signoutLink">
          <img src="{%static 'images/logout_20dp_000000_FILL0_wght400_GRAD0_opsz20.svg'%}" alt="" alt="" />
          logout
        </a>
      </div>
    </aside>
    <main class="main">
      <header class="Inv-header">
        <div>
          <h1>Book Inventory</h1>
          <p>Manage all library books</p>
        </div>
        <div class="searchBox">
          <input type="search" class="searchInput" placeholder="search books....." />
          <button class="searchIcon">
            <img src="{% static 'images/search_22dp_000000_FILL0_wght400_GRAD0_opsz24.svg' %}" alt="" />
          </button>
        </div>
      </header>

      <div class="inv-card">
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>#ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>ISBN</th>
                <th>Year</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="booksTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script type="module" src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/admin.js' %}"></script>
</body>

</html>

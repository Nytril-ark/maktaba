<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maktaba — Admin Dashboard</title>
  <link rel="stylesheet" href="../css/admin_dashboard.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/formpage.css">


</head>

<body>
  <div class="dashbord-wrapper">
    <aside class="sidebar">

      <div class="sidebar-logo">
        <h2>Maktaba Admin</h2>
        <p>FCAI - Library</p>
      </div>

      <ul class="sidbar-nav">
        <li><a href="admin_dashboard.html">Dashboard</a></li>
        <li><a href="book_inventory.html">Book Inventory</a></li>
        <li><a href="add_book.html">Add Book</a></li>
      </ul>

      <div class="sidebar-user">
        <p id="username"></p>
        <p id="email"></p>
        <a href="#" id="logoutButton" class="signoutLink">
          <img src="../images/logout_20dp_000000_FILL0_wght400_GRAD0_opsz20.svg" alt="">
          logout
        </a>
      </div>

    </aside>

    <main class="main">
      <header class="page-header">
        <a href="book_inventory.html" class="back-link">⬅️ Back to Inventory</a>
        <h1>Edit Book</h1>
        <p>Update Book Information</p>


      </header>

      <div class="form-card">
        <div class="form-header">
          <h3>Book Details</h3>
          <p>Enter the book information below. All fields marked with * are required.</p>
        </div>
        <form action="book_inventory.html">

          <div class="form-group full-width">
            <label>Book Title *</label>
            <input type="text" value="Introduction to Algorithms" required id="editTitle">
          </div>

          <div class="form-group full-width">
            <label>Author(s) *</label>
            <input type="text" value="Thomas H.Cormen , Charles E.messi" required id="editAuthors">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Category*</label>
              <select required id="editCategory">
                <option value="SE" selected>Software Engineering</option>
                <option value="AI &DS">AI & Data science</option>
                <option value="Cyper">Cypersecurity</option>
                <option value="Embedded">Embedded Systems</option>
                <option value="Management">Management</option>
                <option value="self-help">Self-Help</option>
              </select>
            </div>

            <div class="form-group">
              <label>ISBN* *</label>
              <input type="text" value="970-02600" required id="editISBN">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Publication year*</label>
              <input type="number" value="2009" required id="editYear">
            </div>

            <div class="form-group">
              <label>Quantity *</label>
              <input type="number" value="19" required id="editQuantity">
            </div>

          </div>

          <div class="form-group full-width">
            <label>Status *</label>
            <select required id="editStatus">
              <option value="available" selected>Available</option>
              <option value="borrowed">Borrowed</option>
              <option value="maintenance">Under Maintenance</option>
              <option value="lost">Lost</option>
            </select>
          </div>



          <div class="form-group full-width">
            <label>Description *</label>
            <textarea rows="4" id="editDescription">A comprehensive textbook on computer algorithms</textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-btn">Update Book</button>
            <a href="book_inventory.html" class="cancel-btn">Cancel</a>
          </div>


        </form>
      </div>

    </main>
  </div>
  <script type="module" src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>

</html>

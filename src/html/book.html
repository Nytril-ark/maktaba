        <button class="searchIcon"><img src="../images/search_22dp_000000_FILL0_wght400_GRAD0_opsz24.svg" alt=""></button>
      </div>
      <a id="login" href="../html/login.html">
        <button class="loginButton">login</button>
      </a>
      <div id="profileSection" class="profile" style="display: none;">
        <button id="profileIcon" class="profilebutton"><img src="../images/account_circle_20dp_E3E3E3_FILL0_wght400_GRAD0_opsz20.svg" alt=""></button>
        <div id="dropDownMenu" class="dropDowncontent">
          <div class="userInfo">
            <p id="username" class="role"></p>
            <p id="email" class="email"></p>
          </div>

          <a href="#" id="logoutButton" class="logoutLink">

          </a>
        </div>
      </div>
    </div>
  </div>

        <div class="book-layout">
          <img id="bookImage" src="" alt="Book Cover">

            <h2 id="bookTitle"></h2>
            <div class="author-1">
              <h4>Authors:</h4>
              <ul id="bookAuthors"></ul>
            </div>
            <aside class="aboutbook-1">
              <h4 id="bookCategory"></h4>
              <h4 id="bookPages"></h4>
              <h4 id="bookLanguage"></h4>
            </aside>
            <article class="discription-1">
              <h3>Description:</h3>
              <p id="bookDescription"></p>
            </article>
            <div class="footer-1">
              <h4 id="bookStatus"></h4>
              <div class="rate-1">
                <h4 id="bookRating"></h4>
                <button>Borrow Book</button>
                <button>Add to Favorite</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer class="footer">
    <div class="footer-columns">

      <div class="footer-column">
        <a href="../html/index.html" class="footerLogo">
